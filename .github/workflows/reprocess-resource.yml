name: Reprocess Resource

on:
  repository_dispatch:
    types:
      - resource_reprocess
  workflow_dispatch:
    inputs:
      resource_id:
        description: 'Resource ID to reprocess'
        required: true
        type: string

jobs:
  reprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env
          echo "NEBIUS_API_KEY=${{ secrets.NEBIUS_API_KEY }}" >> .env
          echo "NEBIUS_LLM_MODEL=${{ secrets.NEBIUS_LLM_MODEL }}" >> .env

      - name: Reprocess resource
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            RESOURCE_ID="${{ github.event.client_payload.resource_id }}"
          else
            RESOURCE_ID="${{ github.event.inputs.resource_id }}"
          fi

          npx --yes tsx scripts/reprocess-resource.ts "$RESOURCE_ID"
